name: Generate signing key (run this once)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create the keystore and a random password
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release-keystore.jks -alias booxmorning \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Geb Sierra, OU=Boox Morning, O=Trinity Bible Church of Edwardsburg, L=Edwardsburg, S=Michigan, C=US"
          base64 -w0 release-keystore.jks > keystore-base64.txt
          {
            echo "Copy each value below into a repository secret with the matching name."
            echo "Settings (top of your repo) -> Secrets and variables -> Actions -> New repository secret."
            echo ""
            echo "Secret name: KEYSTORE_B64"
            echo "Value:"
            cat keystore-base64.txt
            echo ""
            echo "Secret name: KEYSTORE_PASSWORD"
            echo "Value: $PASS"
            echo ""
            echo "Secret name: KEY_ALIAS"
            echo "Value: booxmorning"
            echo ""
            echo "Secret name: KEY_PASSWORD"
            echo "Value: $PASS"
            echo "(same as KEYSTORE_PASSWORD above — that's expected, not a mistake)"
          } > secrets-to-copy.txt

      - name: Upload the keystore and the values to copy
        uses: actions/upload-artifact@v4
        with:
          name: keystore-and-secrets-KEEP-PRIVATE
          path: |
            release-keystore.jks
            secrets-to-copy.txt
          retention-days: 7
